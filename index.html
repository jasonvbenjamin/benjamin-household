@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --color-bg: #131314; --color-fg: #E3E3E3; --color-fg-muted: #9AA0A6; --color-panel: #1E1F20; --color-border-line: #3C4043; color-scheme: dark; } }

html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); }
body { font: 14px/1.4 "Google Sans BF", "Roboto BF", Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
#dash-root { box-sizing: border-box; max-width: 1440px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
@media (min-width: 760px) { #dash-root { padding-left: 32px; padding-right: 32px; } }
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
.gate .card { width: 100%; max-width: 400px; background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 24px; padding: 32px 28px; box-sizing: border-box; display: grid; gap: 16px; }
.gate .logo { width: 48px; height: 48px; border-radius: 14px; background: #1A73E8; color: #fff; display: grid; place-items: center; font: 600 24px/1 "Google Sans BF", system-ui, sans-serif; }
.gate h1 { margin: 0; font: 400 26px/32px "Google Sans BF", system-ui, sans-serif; }
.gate p { margin: 0; color: var(--color-fg-muted); font-size: 15px; line-height: 22px; }
.gate label { display: grid; gap: 6px; font-size: 13px; font-weight: 500; color: var(--color-fg-muted); }
.gate input { font: 400 17px/24px system-ui, sans-serif; color: var(--color-fg); background: var(--color-bg); border: 1px solid var(--color-border-line); border-radius: 12px; padding: 12px 14px; outline: none; }
.gate input:focus { border-color: #1A73E8; box-shadow: 0 0 0 1px #1A73E8; }
.gate button { appearance: none; border: 0; border-radius: 999px; background: #1A73E8; color: #fff; font: 500 16px/24px "Google Sans BF", system-ui, sans-serif; padding: 12px 20px; cursor: pointer; }
.gate button.link { background: none; color: #1A73E8; padding: 4px 0; justify-self: start; }
.gate button[disabled] { opacity: .6; cursor: default; }
.gate .msg { font-size: 14px; } .gate .msg.err { color: #D93025; } .gate .msg.ok { color: #188038; }
.gate .loading { display: flex; gap: 10px; align-items: center; color: var(--color-fg-muted); }
.gate .dot { width: 10px; height: 10px; border-radius: 50%; background: #1A73E8; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }

<script>
(() => {
  const SUPA_URL = 'https://ryuefbrhdwdljijmttqx.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5dWVmYnJoZHdkbGppam10dHF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTUwMTYsImV4cCI6MjEwODUzMTAxNn0.qSim1Yw6xIuNBg1Pry00u3jVISeSDoLn3Rv6Y3Qx3EY';
  const DATASETS = ["accounts", "bench_sources", "benchmarks", "cat_month", "categories", "home", "llc", "monthly", "paychecks", "places", "recurring", "schedule", "statement", "statement_weekly", "summary", "transactions"];

  let booted = false;

  // ---------- sign in ----------
  const showGate = (note, isErr) => {
    gate.hidden = false; root.hidden = true;
    const card = el('div', { class: 'card' });
    card.append(el('div', { class: 'logo' }, 'B'), el('h1', null, 'Benjamin household'), el('p', null, 'Sign in with your email and we’ll send you a link. No password needed.'));
    const lab = el('label', null, 'Email'); const inp = el('input', { type: 'email', autocomplete: 'email', inputmode: 'email', placeholder: 'you@example.com', required: '' }); lab.appendChild(inp);
    const btn = el('button', { type: 'button' }, 'Send sign-in link');
    const msg = el('p', { class: 'msg' + (isErr ? ' err' : '') }, note || '');
    const codeWrap = el('div'); codeWrap.style.display = 'none'; codeWrap.style.gap = '12px'; codeWrap.style.gridTemplateColumns = '1fr';
    const clab = el('label', null, 'Or type the 6-digit code from the email'); const code = el('input', { inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '123456' }); clab.appendChild(code);
    const cbtn = el('button', { type: 'button' }, 'Sign in with code'); codeWrap.append(clab, cbtn);
    const send = async () => {
      const email = inp.value.trim().toLowerCase(); if (!email || !email.includes('@')) { msg.className = 'msg err'; msg.textContent = 'Enter your email address.'; return; }
      btn.disabled = true; msg.className = 'msg'; msg.textContent = 'Sending…';
      const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
      btn.disabled = false;
      if (error) { msg.className = 'msg err'; msg.textContent = /private|Database error/i.test(error.message) ? 'That email isn’t on the household list.' : /rate|seconds/i.test(error.message) ? 'Too many tries. Wait a minute and try again.' : error.message; return; }
      msg.className = 'msg ok'; msg.textContent = 'Check your email for the sign-in link and open it on this device.';
      codeWrap.style.display = 'grid'; btn.textContent = 'Send another link';
    };
    btn.addEventListener('click', send); inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
    cbtn.addEventListener('click', async () => {
      const t = code.value.replace(/\D/g, ''); if (t.length < 6) return;
      cbtn.disabled = true; const { error } = await sb.auth.verifyOtp({ email: inp.value.trim().toLowerCase(), token: t, type: 'email' }); cbtn.disabled = false;
      if (error) { msg.className = 'msg err'; msg.textContent = 'That code didn’t work. Use the newest email, or tap its link.'; }
    });
    card.append(lab, btn, msg, codeWrap);
    gate.replaceChildren(card);
    setTimeout(() => inp.focus(), 50);
  };

  // ---------- the dashboard's data, from your database ----------
  const DATA = {}, STATUS = {}, ERR = {};
  window.dash = {
    _p: { period: 'avg' }, _cbs: [], _calcs: {},
    colors: ['#1a73e8', '#e8710a', '#1e8e3e', '#a142f4', '#12b5cb', '#e52592', '#f9ab00', '#5f6368'],
    data(id) {
      if (this._calcs[id]) { const c = this._calcs[id]; if (c.inputs.some((i) => STATUS[i] !== 'ok')) return { status: 'loading', data: [] }; try { return { status: 'ok', data: c.fn(...c.inputs.map((i) => DATA[i])) }; } catch (e) { return { status: 'error', data: [], message: String(e) }; } }
      if (STATUS[id] === 'ok') return { status: 'ok', data: DATA[id], columns: Object.keys((DATA[id] || [])[0] || {}), meta: [] };
      if (STATUS[id] === 'error') return { status: 'error', data: [], message: ERR[id] };
      if (DATASETS.includes(id)) return { status: 'loading', data: [] };
      return { status: 'missing', data: [] };
    },
    onData(fn) { this._cbs.push(fn); try { fn(); } catch (e) { console.error(e); } },
    params() { return { ...this._p }; },
    setParams(o) { Object.assign(this._p, o); this._fire(); },
    resetParams() { this._p = { period: 'avg' }; this._fire(); },
    setLink(name) { try { history.replaceState(null, '', '#' + name); } catch (e) { /* ignore */ } },
    loader() {}, calc(id, o) { this._calcs[id] = o; },
    refresh(id) { load(id ? [id] : DATASETS); },
    _fire() { this._cbs.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); },
  };
  let fireT = null; const fireSoon = () => { clearTimeout(fireT); fireT = setTimeout(() => window.dash._fire(), 30); };
  window.addEventListener('resize', fireSoon);
  async function load(list) {
    await Promise.all(list.map(async (id) => {
      const { data, error } = await sb.rpc('app_dataset', { p_id: id });
      if (error) { STATUS[id] = 'error'; ERR[id] = error.message; } else { DATA[id] = Array.isArray(data) ? data : []; STATUS[id] = 'ok'; }
      fireSoon();
    }));
  }

  // ---------- shared household documents (budget, places, settings, requests) ----------
  const subs = {};
  const snap = (doc) => ({ exists: doc != null, data: () => (doc == null ? undefined : doc), metadata: { fromCache: false, hasPendingWrites: false } });
  const DB = { doc(path) { return {
    path, id: path.split('/').pop(),
    async get() { const { data, error } = await sb.from('household_docs').select('doc').eq('path', path).maybeSingle(); if (error) throw { code: 'unavailable', message: error.message }; return snap(data ? data.doc : null); },
    async set(d) { const { error } = await sb.from('household_docs').upsert({ path, doc: d, updated_at: new Date().toISOString() }); if (error) throw { code: /row-level|permission/i.test(error.message) ? 'invalid_argument' : 'unavailable', message: error.message }; },
    async update(d) { const cur = (await this.get()).data() || {}; return this.set({ ...cur, ...d }); },
    async delete() { await sb.from('household_docs').delete().eq('path', path); },
    onSnapshot(next) { (subs[path] = subs[path] || []).push(next); this.get().then((s) => next(s)).catch(() => {}); return () => { subs[path] = (subs[path] || []).filter((f) => f !== next); }; },
    collection() { throw new TypeError('not supported'); },
  }; } };
  window.claude = { use: async (n) => (n === 'db' ? DB : null) };

  // ---------- start the page ----------
  const boot = (session) => {
    if (booted) return; booted = true;
    if (/access_token|error_description/.test(location.hash)) history.replaceState(null, '', location.pathname);
    gate.hidden = true; root.hidden = false;
    const frag = document.getElementById('page-src').content.cloneNode(true);
    const scripts = [...frag.querySelectorAll('script')].map((s) => { const t = s.textContent; s.remove(); return t; });
    root.appendChild(frag);
    scripts.forEach((code) => { const s = document.createElement('script'); s.textContent = code; document.body.appendChild(s); });
    load(DATASETS);
    sb.channel('household-docs').on('postgres_changes', { event: '*', schema: 'public', table: 'household_docs' }, (p) => { const r = p.new; if (r && r.path) (subs[r.path] || []).forEach((f) => f(snap(r.doc))); }).subscribe();
    // a sign-out button beside "Your household"
    const addOut = () => { const bar = document.querySelector('.bf-hhbar'); if (!bar) return setTimeout(addOut, 200); const b = el('button', { type: 'button', class: 'bf-btn text' }, 'Sign out'); b.addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); }); bar.appendChild(b); };
    addOut();
    setInterval(() => { if (document.visibilityState === 'visible') load(DATASETS); }, 10 * 60 * 1000);
  };
  const check = async (session) => {
    const { error } = await sb.rpc('app_dataset', { p_id: 'summary' });
    if (error && /not a household member/i.test(error.message)) { await sb.auth.signOut(); showGate('That email isn’t on the household list.', true); return; }
    boot(session);
  };
  sb.auth.onAuthStateChange((ev, session) => { if (session && !booted && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) check(session); else if (!session && ev === 'INITIAL_SESSION') showGate(); });
})();
